<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pacific Bank</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="launch">
    <main class="login-page">
      <section class="login-panel">
        <p class="eyebrow">Welcome to</p>
        <h1 id="bankName">Pacific Bank</h1>
        <p class="muted">Teller banking system for branch staff.</p>
        <p class="muted">Environment: <b id="launchEnv">-</b> | Country: <b id="launchCountry">-</b></p>
        <p class="muted">The sign-in window opens automatically. If it is blocked, use the button below.</p>
        <button id="openLoginBtn" class="btn-primary">Open sign-in window</button>
      </section>
    </main>
    <script src="site.js"></script>
  </body>
</html>
